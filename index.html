<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="login">
<div class="Card"><h1 id="title">Login|Biblion </h1>
    <button id="gerar"> Gerar codigo </button>
    <p id="gerado"><span></span></p>

    <input type="text" placeholder="Digite o código" id="verificar">
    
    <span id="erro" style="color: red;"></span>
  
</div>
</body>
<script>
const verify = document.getElementById("verificar");
const erro = document.getElementById("erro");
let code = "";
document.querySelector("#gerar").addEventListener("click", function(){
    code = String(Math.floor(Math.random() * 80000) + 10000);
    document.querySelector("#gerado").textContent = code;
})

verify.onblur = function(event){

  text = event.target.value

  if (text === code){
    window.location.href = "start.html"
  }else{
    erro.textContent = "Código errado"
}
}
</script>
</html>
